<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ashfield</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #111;
            font-family: -apple-system, sans-serif;
            user-select: none; -webkit-user-select: none;
            touch-action: none;
        }
        #game { display: block; width: 100%; height: 100%; }

        /* UI Слои */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Сердца (HP) */
        .hp-bar { position: absolute; top: 10px; left: 10px; display: flex; gap: 2px; }
        .heart { font-size: 20px; color: #ff3333; text-shadow: 1px 1px 0 #000; }
        .heart.empty { color: #555; }

        /* Инвентарь */
        .inventory { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .inv-slot {
            width: 40px; height: 40px; border: 2px solid #888;
            background: rgba(0,0,0,0.5); border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
        }
        .inv-slot img { width: 32px; height: 32px; image-rendering: pixelated; }
        .inv-slot.empty { display: none; }

        /* Уведомление (Тост) */
        .toast {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
            border-radius: 10px; border: 1px solid #aaa; font-weight: bold;
            display: none; text-align: center; font-size: 16px;
        }

        /* Кнопки управления */
        .controls { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; pointer-events: auto; }
        .dpad { display: flex; gap: 10px; }
        .btn {
            width: 65px; height: 65px; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5);
            color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        .btn:active { background: rgba(255,255,255,0.4); }
        .btn-action { background: rgba(200,50,50,0.6); border-color: #f44336; font-size: 20px;}
        .btn-jump { background: rgba(50,200,50,0.6); border-color: #4caf50; }
        
        /* Кнопка "Взять" */
        .btn-take {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 10px; background: #ffd54f; color: #000;
            font-weight: bold; font-size: 16px; border: 2px solid #fff; display: none; pointer-events: auto;
        }

        /* Диалоги */
        .dialog-box {
            position: absolute; bottom: 100px; left: 10%; width: 80%;
            background: rgba(20,20,30,0.95); border: 3px solid #7cb342;
            border-radius: 10px; padding: 15px; color: #fff; display: none;
            pointer-events: auto; font-size: 15px; line-height: 1.4;
        }
        .dialog-name { color: #ffd54f; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
        .dialog-next { text-align: right; color: #aaa; font-size: 12px; margin-top: 10px; animation: blink 1s infinite; cursor: pointer;}
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Экран смерти */
        .death-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto;
        }
        .death-text { color: #f44336; font-size: 32px; font-weight: bold; margin-bottom: 20px; text-shadow: 2px 2px 0 #000;}
        .btn-restart {
            padding: 15px 30px; font-size: 20px; background: #f44336; color: #fff;
            border: none; border-radius: 10px; font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <!-- UI -->
    <div class="ui-layer">
        <div class="hp-bar" id="hp-bar"></div>
        
        <div class="inventory">
            <div class="inv-slot empty" id="slot-sword"><img src="sword.png" alt="Меч"></div>
            <div class="inv-slot empty" id="slot-staff"><img src="staff.png" alt="Посох"></div>
        </div>

        <div class="toast" id="toast">Предмет получен!</div>

        <div class="dialog-box" id="dialog-box">
            <div class="dialog-name" id="dialog-name">Волшебник</div>
            <div class="dialog-text" id="dialog-text">Привет...</div>
            <div class="dialog-next" id="dialog-next">Нажми, чтобы продолжить ▼</div>
        </div>

        <button class="btn-take" id="btn-take">Взять</button>
    </div>

    <div class="controls">
        <div class="dpad">
            <button class="btn" id="btn-left">◀</button>
            <button class="btn" id="btn-right">▶</button>
        </div>
        <div class="dpad">
            <button class="btn btn-action" id="btn-attack">⚔️</button>
            <button class="btn btn-jump" id="btn-jump">⤒</button>
        </div>
    </div>

    <div class="death-screen" id="death-screen">
        <div class="death-text">ВЫ ПОГИБЛИ</div>
        <button class="btn-restart" id="btn-restart">Начать заново</button>
    </div>

    <script>
        window.Telegram?.WebApp?.ready();
        window.Telegram?.WebApp?.expand();

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W, H;
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        // Ассеты
        const assets = {
            player: new Image(), bg: new Image(), forest: new Image(),
            wizard: new Image(), sword: new Image(), staff: new Image(), scorpion: new Image()
        };
        assets.player.src = 'player.png';
        assets.bg.src = 'background.png';
        assets.forest.src = 'forest_bg.png';
        assets.wizard.src = 'wizard.png';
        assets.sword.src = 'sword.png';
        assets.staff.src = 'staff.png';
        assets.scorpion.src = 'scorpion.png';

        // Константы
        const GRAVITY = 1800, SPEED = 250, JUMP = -650;
        const GROUND_Y_RATIO = 0.8; // Земля на 80% высоты экрана

        // Состояние игры
        let state = {};

        function initGame() {
            state = {
                location: 1, // 1 = старт, 2 = лес
                camera: { x: 0 },
                player: { x: 100, y: 0, vx: 0, vy: 0, onGround: false, facing: 1, frame: 0, animTimer: 0, hp: 9, maxHp: 9, hasSword: false, hasStaff: false, attacking: 0, attackTimer: 0, hitEnemies: [] },
                worldWidth: 3000,
                groundY: 0,
                objects: [], // Предметы на земле
                npcs: [], // Волшебники
                enemies: [],
                projectiles: [],
                dialog: { active: false, lines: [], index: 0, onComplete: null },
                scriptStage: 0, // 0=старт, 1=убит скорпион, 2=в лесу
                dead: false
            };
            
            // Настройка мира
            resizeWorld();
            
            // Игрок
            state.player.y = state.groundY - 64;

            // Волшебник 1
            state.npcs.push({
                id: 'wizard1', x: 300, y: state.groundY - 80, w: 64, h: 80,
                img: 'wizard', visible: true, interactable: true
            });

            updateUI();
        }

        function resizeWorld() {
            state.groundY = H * GROUND_Y_RATIO;
            state.worldWidth = Math.max(W * 3, 2500);
            if (state.location === 2) state.worldWidth = W * 2;
        }
        window.addEventListener('resize', () => { resize(); resizeWorld(); });

        // ============ UI ============
        function updateUI() {
            // Сердца
            const hpBar = document.getElementById('hp-bar');
            hpBar.innerHTML = '';
            for (let i = 0; i < state.player.maxHp; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart' + (i < state.player.hp ? '' : ' empty');
                heart.innerText = '❤️';
                hpBar.appendChild(heart);
            }
            // Инвентарь
            document.getElementById('slot-sword').className = 'inv-slot ' + (state.player.hasSword ? '' : 'empty');
            document.getElementById('slot-staff').className = 'inv-slot ' + (state.player.hasStaff ? '' : 'empty');
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        function showDialog(name, lines, onComplete) {
            state.dialog = { active: true, name: name, lines: lines, index: 0, onComplete: onComplete };
            document.getElementById('dialog-box').style.display = 'block';
            document.getElementById('dialog-name').innerText = name;
            document.getElementById('dialog-text').innerText = lines[0];
        }

        document.getElementById('dialog-next').addEventListener('click', () => {
            if (!state.dialog.active) return;
            state.dialog.index++;
            if (state.dialog.index >= state.dialog.lines.length) {
                state.dialog.active = false;
                document.getElementById('dialog-box').style.display = 'none';
                if (state.dialog.onComplete) state.dialog.onComplete();
            } else {
                document.getElementById('dialog-text').innerText = state.dialog.lines[state.dialog.index];
            }
        });

        // ============ УПРАВЛЕНИЕ ============
        const input = { left: false, right: false, jump: false, attack: false };
        const bindBtn = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); input[key] = true; });
            el.addEventListener('touchend', e => { e.preventDefault(); input[key] = false; });
            el.addEventListener('mousedown', e => { e.preventDefault(); input[key] = true; });
            el.addEventListener('mouseup', e => { e.preventDefault(); input[key] = false; });
        };
        bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right');
        bindBtn('btn-jump', 'jump'); bindBtn('btn-attack', 'attack');
        
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') input.jump = true;
            if (e.key === ' ') input.attack = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w') input.jump = false;
            if (e.key === ' ') input.attack = false;
        });

        // Кнопка "Взять"
        document.getElementById('btn-take').addEventListener('click', () => {
            const p = state.player;
            for (let i = 0; i < state.objects.length; i++) {
                const obj = state.objects[i];
                if (Math.abs(p.x - obj.x) < 60 && !obj.taken) {
                    obj.taken = true;
                    if (obj.type === 'sword') { p.hasSword = true; showToast('Получен предмет: Меч'); }
                    if (obj.type === 'staff') { p.hasStaff = true; showToast('Получен предмет: Посох'); }
                    updateUI();
                    break;
                }
            }
        });

        // Рестарт
        document.getElementById('btn-restart').addEventListener('click', () => {
            document.getElementById('death-screen').style.display = 'none';
            initGame();
        });

        // ============ ЛОГИКА ============
        function update(dt) {
            if (state.dead || state.dialog.active) {
                state.player.vx = 0; state.player.vy = 0; return;
            }

            const p = state.player;

            // Движение
            p.vx = 0;
            if (input.left) { p.vx = -SPEED; p.facing = -1; }
            if (input.right) { p.vx = SPEED; p.facing = 1; }
            if (input.jump && p.onGround) { p.vy = JUMP; p.onGround = false; }

            p.vy += GRAVITY * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            // Границы
            if (p.x < 20) p.x = 20;
            if (p.x > state.worldWidth - 20) p.x = state.worldWidth - 20;

            // Земля
            if (p.y + 64 >= state.groundY) {
                p.y = state.groundY - 64;
                p.vy = 0;
                p.onGround = true;
            }

            // Анимация
            if (Math.abs(p.vx) > 0 && p.onGround) {
                p.animTimer += dt;
                if (p.animTimer > 0.15) { p.animTimer = 0; p.frame = (p.frame + 1) % 4; }
            } else { p.frame = 0; }

            // Атака
            if (input.attack && p.hasSword && p.attackTimer <= 0) {
                p.attackTimer = 0.5;
                p.attacking = 0.3;
                p.hitEnemies = [];
            }
            if (p.attackTimer > 0) { p.attackTimer -= dt; p.attacking -= dt; }
            if (input.attack) input.attack = false; // Сброс, чтобы не спамить

            // Проверка кнопки "Взять"
            let showTake = false;
            for (const obj of state.objects) {
                if (!obj.taken && Math.abs(p.x - obj.x) < 60) showTake = true;
            }
            document.getElementById('btn-take').style.display = showTake ? 'block' : 'none';

            // Сюжет: Волшебник 1
            const wiz = state.npcs.find(n => n.id === 'wizard1');
            if (wiz && wiz.visible && state.scriptStage === 0) {
                if (Math.abs(p.x - wiz.x) < 80 && !state.dialog.active) {
                    wiz.visible = false; // Исчезает для диалога
                    showDialog('Волшебник', [
                        'Добро пожаловать в мир Ashfield.',
                        'Думаю, тебе пригодится этот меч.',
                        'В этом мире множество враждебных существ.',
                        'Будь осторожен.',
                        'Вперёд!'
                    ], () => {
                        p.hasSword = true;
                        showToast('Получен предмет: Меч');
                        updateUI();
                        state.scriptStage = 1; // Переход к скорпиону
                    });
                }
            }

            // Сюжет: Скорпион
            if (state.scriptStage === 1 && state.enemies.length === 0 && !state.dialog.active) {
                if (p.x > 500) { // На 30-м блоке
                    state.enemies.push({
                        type: 'scorpion', x: p.x + 400, y: state.groundY - 60,
                        vx: 0, vy: 0, hp: 10, maxHp: 10, facing: -1,
                        shootTimer: 2, alive: true, frame: 0
                    });
                }
            }

            // Логика врагов
            for (const enemy of state.enemies) {
                if (!enemy.alive) continue;
                // Движение к игроку
                if (Math.abs(enemy.x - p.x) > 100) {
                    enemy.vx = (p.x > enemy.x) ? 80 : -80;
                    enemy.facing = enemy.vx > 0 ? 1 : -1;
                } else {
                    enemy.vx = 0;
                }
                enemy.x += enemy.vx * dt;

                // Стрельба
                enemy.shootTimer -= dt;
                if (enemy.shootTimer <= 0 && Math.abs(enemy.x - p.x) < 400) {
                    enemy.shootTimer = 2;
                    state.projectiles.push({
                        x: enemy.x, y: enemy.y + 20, vx: enemy.facing * 300, vy: 0, alive: true
                    });
                }

                // Проверка удара
                if (p.attacking > 0 && !p.hitEnemies.includes(enemy)) {
                    const hitX = p.x + (p.facing * 60);
                    if (Math.abs(hitX - enemy.x) < 60 && Math.abs(p.y - enemy.y) < 80) {
                        enemy.hp -= 1;
                        p.hitEnemies.push(enemy);
                        if (enemy.hp <= 0) {
                            enemy.alive = false;
                            setTimeout(() => {
                                if (state.scriptStage === 1) {
                                    showDialog('Волшебник', [
                                        'Вижу, ты справился со скорпионом, молодец.',
                                        'Теперь я могу доверить тебе этот посох.',
                                        'Этот посох позволяет переходить в другие миры.',
                                        'Но использовать его ты сможешь...',
                                        'Только когда накопишь достаточно опыта.',
                                        'Но давай немного поменяем обстановку.'
                                    ], () => {
                                        p.hasStaff = true;
                                        showToast('Получен предмет: Посох');
                                        updateUI();
                                        state.scriptStage = 2;
                                        // Телепорт в лес
                                        setTimeout(() => {
                                            state.location = 2;
                                            state.worldWidth = W * 2;
                                            p.x = 100;
                                            p.y = state.groundY - 64;
                                            state.enemies = [];
                                            state.npcs = []; // Убираем волшебника
                                            showToast('Переход в лес...');
                                        }, 1000);
                                    });
                                }
                            }, 2000);
                        }
                    }
                }
            }
            state.enemies = state.enemies.filter(e => e.alive || e.hp > 0);

            // Логика снарядов (фаерболов)
            for (const proj of state.projectiles) {
                proj.x += proj.vx * dt;
                if (Math.abs(proj.x - (p.x + 30)) < 30 && Math.abs(proj.y - (p.y + 30)) < 40) {
                    proj.alive = false;
                    p.hp -= 1;
                    updateUI();
                    if (p.hp <= 0) {
                        state.dead = true;
                        document.getElementById('death-screen').style.display = 'flex';
                    }
                }
            }
            state.projectiles = state.projectiles.filter(pr => pr.alive && pr.x > 0 && pr.x < state.worldWidth);

            // Камера
            const targetCam = p.x - W / 2;
            state.camera.x += (targetCam - state.camera.x) * 10 * dt;
            state.camera.x = Math.max(0, Math.min(state.camera.x, state.worldWidth - W));
        }

        // ============ ОТРИСОВКА ============
        function draw() {
            const cam = state.camera.x;
            const groundY = state.groundY;

            // 1. Фон (весь экран)
            const bgImg = state.location === 1 ? assets.bg : assets.forest;
            if (bgImg.complete && bgImg.naturalWidth > 0) {
                // Растягиваем на весь экран
                ctx.drawImage(bgImg, 0, 0, W, H);
            } else {
                ctx.fillStyle = state.location === 1 ? '#5a2a2a' : '#2e4a2e';
                ctx.fillRect(0, 0, W, H);
            }

            // 2. Земля
            ctx.fillStyle = '#3a1f08';
            ctx.fillRect(0, groundY, W, H - groundY);
            ctx.fillStyle = '#6b8f3d';
            ctx.fillRect(0, groundY, W, 10);

            // 3. Волшебник
            for (const npc of state.npcs) {
                if (!npc.visible) continue;
                const scrX = npc.x - cam;
                if (scrX > -100 && scrX < W + 100) {
                    if (assets.wizard.complete && assets.wizard.naturalWidth > 0) {
                        ctx.drawImage(assets.wizard, scrX, npc.y, npc.w, npc.h);
                    } else {
                        ctx.fillStyle = '#4a4aff'; ctx.fillRect(scrX, npc.y, npc.w, npc.h);
                    }
                }
            }

            // 4. Враги
            for (const enemy of state.enemies) {
                if (!enemy.alive) continue;
                const scrX = enemy.x - cam;
                if (scrX > -100 && scrX < W + 100) {
                    if (assets.scorpion.complete && assets.scorpion.naturalWidth > 0) {
                        ctx.save();
                        if (enemy.facing === -1) {
                            ctx.translate(scrX + 60, enemy.y);
                            ctx.scale(-1, 1);
                            ctx.drawImage(assets.scorpion, 0, 0, 64, 64);
                        } else {
                            ctx.drawImage(assets.scorpion, scrX, enemy.y, 64, 64);
                        }
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#f44336'; ctx.fillRect(scrX, enemy.y, 64, 64);
                    }
                    // HP бар
                    ctx.fillStyle = '#000'; ctx.fillRect(scrX, enemy.y - 10, 64, 6);
                    ctx.fillStyle = '#f44336'; ctx.fillRect(scrX, enemy.y - 10, 64 * (enemy.hp / enemy.maxHp), 6);
                }
            }

            // 5. Снаряды
            for (const proj of state.projectiles) {
                const scrX = proj.x - cam;
                ctx.fillStyle = '#ff5722';
                ctx.beginPath();
                ctx.arc(scrX, proj.y, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            // 6. Предметы на земле (если есть)
            for (const obj of state.objects) {
                if (obj.taken) continue;
                const scrX = obj.x - cam;
                // Отрисовка (пока не используется, но на будущее)
                ctx.fillStyle = '#ffd54f';
                ctx.fillRect(scrX - 10, state.groundY - 20, 20, 20);
            }

            // 7. Игрок
            const p = state.player;
            const scrX = p.x - cam;
            if (assets.player.complete && assets.player.naturalWidth > 0) {
                const fw = assets.player.width / 4;
                const fh = assets.player.height / 4;
                const row = p.facing > 0 ? 2 : 1;
                const frame = p.frame % 4;
                ctx.save();
                if (p.facing === -1) {
                    // Отражаем для левого направления (если спрайт по умолчанию смотрит вправо)
                    // Но у нас 4 направления, так что просто берем строку 1 (лево)
                }
                ctx.drawImage(assets.player, frame * fw, row * fh, fw, fh, scrX - 16, p.y, 64, 64);
                ctx.restore();
            } else {
                ctx.fillStyle = '#2196f3'; ctx.fillRect(scrX, p.y, 64, 64);
            }

            // 8. Меч (анимация удара)
            if (p.attacking > 0) {
                ctx.save();
                ctx.translate(scrX + 32, p.y + 32);
                ctx.scale(p.facing, 1);
                ctx.rotate(-0.5 + (1 - p.attacking / 0.3) * 1.5);
                if (assets.sword.complete && assets.sword.naturalWidth > 0) {
                    ctx.drawImage(assets.sword, 20, -20, 60, 60);
                } else {
                    ctx.fillStyle = '#ccc';
                    ctx.fillRect(20, -5, 60, 10);
                }
                ctx.restore();
            }

            // Виньетка для атмосферы
            const grad = ctx.createRadialGradient(W/2, H/2, W*0.4, W/2, H/2, W*0.8);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
        }

        // ============ ЦИКЛ ============
        let lastTime = 0;
        function loop(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;
            update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        initGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
